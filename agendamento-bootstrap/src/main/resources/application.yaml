spring:
  application:
    name: agendamento-app

  mvc:
    servlet:
      path: /api/v1

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agendamento-hospitalar}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update} #validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true