spring:
  application:
    name: agendamento-app

  mvc:
    servlet:
      path: /api/v1

  security:
    jwt:
      issuer: "agendamento-api"
      secret-key: "2d57500fd645f84103d0fb2f277b629d1d7a3ecd8fc9774fdd345bddbe2eab5f"
      expiration-seconds: 3600

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agendamento-hospitalar}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update} #validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

logging:
  level:
    org.hibernate.orm.results: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: TRACE